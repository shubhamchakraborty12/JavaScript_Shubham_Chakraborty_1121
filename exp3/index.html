<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Grading System</h2>
        <!-- novalidate ensures our custom JS handles the logic exclusively -->
        <form id="gradeForm" novalidate>
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student's full name">
                <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="studentMarks">Marks Obtained (0 - 100):</label>
                <input type="number" id="studentMarks" placeholder="Enter numerical marks">
                <span class="error-msg" id="marksError"></span>
            </div>

            <button type="submit">Evaluate Grade</button>
        </form>

        <div id="resultCard" class="result-card hidden">
            <h3>Evaluation Result</h3>
            <p><strong>Student:</strong> <span id="resName"></span></p>
            <p><strong>Score:</strong> <span id="resScore"></span>%</p>
            <p><strong>Grade:</strong> <span id="resGrade"></span></p>
            <p><strong>Status:</strong> <span id="resStatus"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
